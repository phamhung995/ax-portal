<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample 1 - Minimal</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f5f7; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f5f7; padding:32px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="padding:28px 40px 20px 40px; border-bottom:1px solid #eceef1;">
              <span style="font-size:18px; font-weight:bold; color:#1a1d21; letter-spacing:0.5px;">AI SKILL MANAGEMENT</span>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:32px 40px;">
              <p style="margin:0 0 8px 0; font-size:15px; color:#1a1d21;">Your verification code for account registration is:</p>
              <div style="margin:20px 0; text-align:center;">
                <span style="display:inline-block; font-size:36px; font-weight:bold; letter-spacing:12px; color:#1a1d21; padding-left:12px;">643084</span>
              </div>
              <p style="margin:0; font-size:13px; line-height:1.6; color:#6b7280;">
                This code is valid for 5 minutes. If you did not request it, you can ignore this email.
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:20px 40px 24px 40px; border-top:1px solid #eceef1;">
              <p style="margin:0; font-size:12px; color:#9aa1ab;">This is an automated message from AI Skill Management. Please do not reply.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
