spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS TEXT
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    # NOTE: do NOT set database-platform here. The main application.yml sets
    # PostgreSQLDialect, which emits the jsonb column type the entities use.
    # H2 does not know jsonb natively, so the URL above creates a JSONB
    # domain (as TEXT) via INIT.
  flyway:
    enabled: false

jwt:
  secret-key: dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW9ubHk=
  expiration: 3600000
  refresh-expiration: 604800000

