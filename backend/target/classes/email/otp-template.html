<html lang="en">
<head>

<title>AI Skill Management</title>

<body style="margin:0; padding:0; background-color:#0d1526; font-family: Arial, Helvetica, sans-serif;">

    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background-color:#131f38; border:1px solid #24345c; border-radius:12px; overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="padding:32px 40px 24px 40px; border-bottom:1px solid #24345c;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="width:36px; height:36px; background-color:#1d2c52; border-radius:8px; text-align:center; vertical-align:middle;">
                    <span style="font-size:18px; color:#67e8f9;">&#10022;</span>
                  </td>
                  <td style="padding-left:12px;">
                    <span style="font-size:16px; font-weight:bold; color:#f2f6ff; letter-spacing:1px;">AI SKILL MANAGEMENT</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:32px 40px;">
              <p style="margin:0 0 6px 0; font-size:20px; font-weight:bold; color:#f2f6ff;">Verify your account</p>
              <p style="margin:0 0 24px 0; font-size:14px; line-height:1.6; color:#9fb0d0;">
                {{MESSAGE}}
              </p>
              <!-- OTP box -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="background-color:#0d1830; border:1px solid #2f4576; border-radius:8px; padding:20px 0;">
                    <span style="font-size:32px; font-weight:bold; letter-spacing:10px; color:#67e8f9; padding-left:10px;">{{OTP}}</span>
                  </td>
                </tr>
              </table>
              <p style="margin:20px 0 0 0; font-size:13px; line-height:1.6; color:#7d8db1;">
                This code is valid for 5 minutes. If you did not request it, you can ignore this email.
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:20px 40px 24px 40px; border-top:1px solid #24345c;">
              <p style="margin:0; font-size:12px; line-height:1.5; color:#5a6b91;">
                This is an automated message from AI Skill Management. Please do not reply to this email.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
